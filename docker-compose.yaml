services:
  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - TZ=Asia/Jakarta
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks:
      - odoo-network
    restart: always

  odoo:
    image: odoo:18.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - TZ=Asia/Jakarta
      - LIST_DB=False
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./custom-addons:/mnt/extra-addons
      - ./setup:/setup
    networks:
      - odoo-network
    restart: always
    command: /setup/entrypoint.sh

  metabase:
    image: metabase/metabase:latest
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=postgres
      - MB_DB_PORT=5432
      - MB_DB_USER=odoo
      - MB_DB_PASS=odoo
      - MB_DB_HOST=db
      - TZ=Asia/Jakarta
    volumes:
      - metabase-data:/metabase-data
    networks:
      - odoo-network
    restart: always

volumes:
  odoo-db-data:
  odoo-web-data:
  metabase-data:

networks:
  odoo-network:
